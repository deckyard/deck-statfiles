# Grimoire book configuration for the @deckyard/statfiles documentation.

[book]
title = "@deckyard/statfiles"
description = "Readers for SPSS, Stata and SAS data files"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "ember"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-statfiles/"
repoUrl = "https://github.com/deckyard/deck-statfiles"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-statfiles/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
